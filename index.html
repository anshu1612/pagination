<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagination</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="bg-gray-300 flex flex-col items-center justify-center p-7">
      <div id="content" class="bg-white p-5 pb-3 mb-7 rounded-2xl sm:max-w-96"></div>
      <div id="pagination" class="flex">
        <button id="prevBtn" class="bg-white h-10 w-10 rounded-full mr-2">
          <i class="fa-solid fa-chevron-left" style="color: #4b55cd"></i>
        </button>
        <div id="buttons" class="space-x-2"></div>
        <button id="nxtBtn" class="bg-white h-10 w-10 rounded-full ml-2">
          <i class="fa-solid fa-chevron-right" style="color: #4b55cd"></i>
        </button>
      </div>
    </div>
    <script src="/index.js"></script>
    <script
      src="https://kit.fontawesome.com/a906d10607.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
